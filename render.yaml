services:
  - type: web
    name: easytax-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        value: https://easytax-web.onrender.com
      - key: MAX_UPLOAD_MB
        value: 5
      - key: UPLOAD_DIR
        value: uploads
    disk:
      name: easytax-uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

  - type: static
    name: easytax-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://easytax-api.onrender.com/api
